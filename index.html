<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b1017"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Hermes额度"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Hermes 额度</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<style>
:root{
  --bg:#0b1017; --card:#152033; --text:#eef3fb; --muted:#8b9bb4;
  --hi:#3dd68c; --mid:#ffcc66; --lo:#f07178; --track:#273349; --line:#243247;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  min-height:100%}
body{
  background:
    radial-gradient(700px 380px at 0% 0%, #1a2d4a 0%, transparent 55%),
    radial-gradient(560px 360px at 100% 8%, #1e3328 0%, transparent 50%),
    var(--bg);
  padding: calc(16px + var(--safe-top)) 14px calc(28px + var(--safe-bottom));
}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:1.35rem;letter-spacing:.2px}
.meta{color:var(--muted);font-size:.82rem;margin-top:4px;line-height:1.35}
.actions{display:flex;gap:8px;flex-shrink:0}
btn,.btn{
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:650;cursor:pointer;
}
.btn.primary{background:rgba(61,214,140,.16);border-color:rgba(61,214,140,.4);color:var(--hi)}
.btn:disabled{opacity:.5}
.toast{min-height:18px;color:var(--muted);font-size:.78rem;margin-bottom:10px}
.toast.err{color:var(--lo)}
.toast.ok{color:var(--hi)}
h2{margin:18px 0 10px;font-size:.95rem;color:#c9d6ea;font-weight:650}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.heroes{grid-template-columns:1fr}}
.hero{
  background:linear-gradient(180deg,#1a2740,#121c2c);
  border:1px solid var(--line);border-radius:16px;padding:14px 10px 12px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 8px 22px rgba(0,0,0,.28);
}
.ring-wrap{position:relative;width:132px;height:132px}
.ring-wrap svg{width:132px;height:132px;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring-center .pct{font-size:1.35rem;font-weight:800}
.ring-center .lbl{font-size:.7rem;color:var(--muted);margin-top:2px}
.hero-title{margin-top:8px;font-weight:700;font-size:.88rem;text-align:center}
.chip{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;
  background:rgba(122,162,247,.18);color:#9bb6f5;border:1px solid rgba(122,162,247,.35);margin-top:4px}
.hero-sub{color:var(--muted);font-size:.72rem;margin-top:5px;text-align:center;line-height:1.3}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.brow{display:grid;grid-template-columns:1fr 42px;gap:6px 8px;align-items:center;margin-bottom:12px}
.brow:last-child{margin-bottom:0}
.blabel{font-size:.82rem;color:#d5deed}
.btrack{grid-column:1;height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.bfill{height:100%;border-radius:999px}
.bfill.hi{background:linear-gradient(90deg,#24965f,var(--hi))}
.bfill.mid{background:linear-gradient(90deg,#c7951a,var(--mid))}
.bfill.lo{background:linear-gradient(90deg,#c94c53,var(--lo))}
.bval{grid-column:2;grid-row:1 / span 2;text-align:right;font-weight:800;font-size:.9rem;align-self:center}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;opacity:.85}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.tile-name{font-weight:700;font-size:.88rem}
.tile-reason{color:var(--muted);font-size:.72rem;margin-top:4px;word-break:break-all}
.notes{color:var(--muted);font-size:.82rem}
.notes ul{margin:6px 0 0;padding-left:18px}
footer{margin-top:20px;color:var(--muted);font-size:.72rem;line-height:1.4}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 0 rgba(61,214,140,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,214,140,.55)}70%{box-shadow:0 0 0 8px rgba(61,214,140,0)}100%{box-shadow:0 0 0 0 rgba(61,214,140,0)}}
.empty{color:var(--muted);font-size:.88rem;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Hermes 额度</h1>
      <div class="meta" id="meta">加载中…</div>
      <div class="live" id="live" hidden><i></i><span>自动刷新已开 · 每 3 分钟</span></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnRefresh" type="button">刷新</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="app"></div>
  <footer>
    加到主屏幕后可当 App 用。数据来自公开 JSON，不含密钥。<br/>
    Grok cookie 抓取关闭 · 未连 DMIT
  </footer>
</div>
<script>
// CONFIG: same-origin by default; override with ?data=URL
const DEFAULT_DATA = "quota.json";
const REFRESH_MS = 3 * 60 * 1000;
const META = {
  "openai-codex": {short:"Codex", color:"#3dd68c"},
  "anthropic": {short:"Claude", color:"#ba8cff"},
  "gemini": {short:"Gemini", color:"#5aaaff"},
  "grok": {short:"Grok", color:"#b4b4be"},
  "kimi": {short:"Kimi", color:"#ffaa5a"},
  "nous": {short:"Nous", color:"#c8a078"},
  "copilot": {short:"Copilot", color:"#c8c8d2"},
  "opencode-go": {short:"OpenCode", color:"#f0d25a"},
  "openrouter": {short:"OpenRouter", color:"#64b4dc"}
};
const EMBEDDED = {
  "fetched_at": "2026-09-05T04:01:34.558949+00:00",
  "providers": {
    "anthropic": {
      "details": [],
      "label": "anthropic",
      "plan": null,
      "unavailable_reason": "no-data",
      "windows": []
    },
    "copilot": {
      "details": [],
      "label": "copilot",
      "plan": null,
      "unavailable_reason": "no-credentials",
      "windows": []
    },
    "gemini": {
      "details": [],
      "label": "gemini",
      "plan": null,
      "unavailable_reason": "no-credentials",
      "windows": []
    },
    "grok": {
      "details": [],
      "label": "grok",
      "plan": null,
      "unavailable_reason": "opt-in-disabled",
      "windows": []
    },
    "kimi": {
      "details": [],
      "label": "kimi",
      "plan": null,
      "unavailable_reason": "no-credentials",
      "windows": []
    },
    "nous": {
      "details": [],
      "label": "nous",
      "plan": null,
      "unavailable_reason": "not-logged-in",
      "windows": []
    },
    "openai-codex": {
      "details": [
        "You have 3 resets banked - use /usage reset to activate"
      ],
      "label": "openai-codex",
      "plan": "Plus",
      "unavailable_reason": null,
      "windows": [
        {
          "label": "Session",
          "reset_at": "2026-09-05T05:55:10+00:00",
          "used_percent": 12.0
        },
        {
          "label": "Weekly",
          "reset_at": "2026-09-07T13:25:40+00:00",
          "used_percent": 44.0
        }
      ]
    },
    "opencode-go": {
      "details": [],
      "label": "opencode-go",
      "plan": null,
      "unavailable_reason": "no-credentials",
      "windows": []
    },
    "openrouter": {
      "details": [],
      "label": "openrouter",
      "plan": null,
      "unavailable_reason": "no-data",
      "windows": []
    }
  }
};

function qs(name){
  try{ return new URLSearchParams(location.search).get(name); }catch(e){ return null; }
}
function dataUrl(){
  const q = qs("data");
  if(q) return q;
  // When opened as file://, relative fetch often fails — use embedded then
  if(location.protocol === "file:") return null;
  return DEFAULT_DATA;
}
function remColor(rem){
  if(rem >= 60) return {css:"hi", hex:"#3dd68c"};
  if(rem >= 30) return {css:"mid", hex:"#ffcc66"};
  return {css:"lo", hex:"#f07178"};
}
function fmt(iso){
  if(!iso) return "—";
  try{
    const d = new Date(iso);
    return d.toLocaleString("zh-CN", {hour12:false, timeZone:"Asia/Shanghai"});
  }catch(e){ return iso; }
}
function fmtShort(iso){
  if(!iso) return "—";
  try{
    const d = new Date(iso);
    const p = new Intl.DateTimeFormat("zh-CN", {
      timeZone:"Asia/Shanghai", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", hour12:false
    }).formatToParts(d);
    const get = t => (p.find(x=>x.type===t)||{}).value || "";
    return `${get("month")}-${get("day")} ${get("hour")}:${get("minute")}`;
  }catch(e){ return iso; }
}
function ringSvg(rem, color){
  const size=132, stroke=12, r=(size-stroke)/2, c=2*Math.PI*r;
  const offset = c * (1 - Math.max(0,Math.min(100,rem))/100);
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2a3548" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}
function render(data){
  const providers = data.providers || {};
  const avail=[], unavail=[];
  Object.keys(providers).sort().forEach(key=>{
    const p = providers[key];
    const m = META[key] || {short:p.label||key, color:"#96a0b4"};
    const entry = {key, ...m, plan:p.plan, reason:p.unavailable_reason, windows:p.windows||[], details:p.details||[]};
    if(entry.reason) unavail.push(entry); else avail.push(entry);
  });
  const windows=[];
  avail.forEach(e=>{
    e.windows.forEach(w=>{
      const used = Number(w.used_percent||0);
      const rem = Math.max(0, 100-used);
      windows.push({...e, wlabel:w.label||"window", used, rem, reset:w.reset_at});
    });
  });
  let html = "";
  html += `<h2>可用额度</h2>`;
  if(!windows.length) html += `<div class="empty">当前没有可用 provider</div>`;
  else {
    html += `<div class="heroes">` + windows.map(w=>{
      const c = remColor(w.rem);
      const plan = w.plan ? `<span class="chip">${esc(w.plan)}</span>` : "";
      return `<div class="hero">
        <div class="ring-wrap">${ringSvg(w.rem,c.hex)}
          <div class="ring-center"><div class="pct" style="color:${c.hex}">${w.rem.toFixed(0)}%</div><div class="lbl">剩余</div></div>
        </div>
        <div class="hero-title">${esc(w.short)} · ${esc(w.wlabel)}</div>
        ${plan}
        <div class="hero-sub">已用 ${w.used.toFixed(0)}% · 重置 ${esc(fmtShort(w.reset))}</div>
      </div>`;
    }).join("") + `</div>`;
  }
  html += `<h2>条形对比</h2><div class="chart">`;
  if(!windows.length) html += `<div class="empty">暂无对比数据</div>`;
  else html += windows.map(w=>{
    const c = remColor(w.rem);
    return `<div class="brow">
      <div class="blabel">${esc(w.short)} / ${esc(w.wlabel)}</div>
      <div class="bval" style="color:${c.hex}">${w.rem.toFixed(0)}%</div>
      <div class="btrack"><div class="bfill ${c.css}" style="width:${w.rem.toFixed(1)}%"></div></div>
    </div>`;
  }).join("");
  html += `</div>`;
  html += `<h2>不可用 / 未配置</h2><div class="tiles">`;
  html += unavail.map(e=>`<div class="tile">
    <div class="tile-name"><span class="dot" style="background:${e.color}"></span>${esc(e.short)}</div>
    <div class="tile-reason">${esc(e.reason||"unavailable")}</div>
  </div>`).join("") || `<div class="empty">全部可用</div>`;
  html += `</div>`;
  const notes=[];
  avail.forEach(e=>(e.details||[]).forEach(d=>notes.push(`${e.short}：${d}`)));
  if(notes.length){
    html += `<h2>备注</h2><div class="notes"><ul>${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`;
  }
  document.getElementById("app").innerHTML = html;
  document.getElementById("meta").textContent = `拉取时间 ${fmt(data.fetched_at)} · 圆环/条形 = 剩余额度`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }
function setToast(msg, kind){
  const el = document.getElementById("toast");
  el.className = "toast" + (kind ? " "+kind : "");
  el.textContent = msg || "";
}
async function load(manual){
  const btn = document.getElementById("btnRefresh");
  btn.disabled = true;
  const url = dataUrl();
  try{
    let data;
    if(url){
      const u = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
      const res = await fetch(u, {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      data = await res.json();
      setToast(manual ? "已刷新" : "", manual ? "ok" : "");
      document.getElementById("live").hidden = false;
    } else {
      data = EMBEDDED;
      setToast("本地快照（file 打开无法联网刷新，请用网页链接）", "err");
      document.getElementById("live").hidden = true;
    }
    render(data);
    try{ localStorage.setItem("hermes-quota-cache", JSON.stringify(data)); }catch(e){}
  }catch(err){
    // fallback cache / embedded
    let data = null;
    try{ data = JSON.parse(localStorage.getItem("hermes-quota-cache")||"null"); }catch(e){}
    if(!data) data = EMBEDDED;
    render(data);
    setToast("刷新失败，显示缓存："+err.message, "err");
  }finally{
    btn.disabled = false;
  }
}
document.getElementById("btnRefresh").addEventListener("click", ()=>load(true));
load(false);
setInterval(()=>load(false), REFRESH_MS);
// pull-ish: visibility resume
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(false); });
</script>
</body>
</html>
